<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Touraine – les événements sur la carte</title>
<meta name="description" content="Tous les événements à venir en Touraine (Indre-et-Loire), sur une carte.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{--ink:#1d2b2a;--paper:#f6f8f5;--loire:#1f6f78;--tuffeau:#e9e2cf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:16px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.7rem 1rem;background:var(--tuffeau);border-bottom:2px solid var(--loire)}
h1{margin:0;font:700 1.35rem Georgia,serif}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-left:auto}
input,select{font:inherit;padding:.4rem .6rem;border:1px solid #8a9a9a;border-radius:4px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--loire);outline-offset:1px}
#count{font-size:.9rem;width:100%}
#map{flex:1;min-height:0}
.pop h2{margin:0 0 .2rem;font:700 1rem Georgia,serif}
.pop p{margin:.25rem 0}.pop img{max-width:100%;max-height:120px;border-radius:3px}
footer{padding:.4rem 1rem;font-size:.78rem;background:var(--tuffeau)}
</style>
</head>
<body>
<header>
  <h1>Agenda Touraine</h1>
  <div class="filters">
    <input id="q" type="search" placeholder="Titre ou commune" aria-label="Rechercher un événement ou une commune">
    <select id="period" aria-label="Période">
      <option value="all">Toutes les dates</option>
      <option value="today">Aujourd’hui</option>
      <option value="weekend">Ce week-end</option>
      <option value="7">7 prochains jours</option>
      <option value="30">30 prochains jours</option>
    </select>
  </div>
  <div id="count" role="status">Chargement…</div>
</header>
<div id="map"></div>
<footer>
  Données : DATAtourisme, <a href="https://www.etalab.gouv.fr/licence-ouverte-open-licence/">Licence Ouverte 2.0</a>.
  Fond de carte © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>. <span id="updated"></span>
</footer>
<noscript>Cette carte nécessite JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = s => new Date(s + "T00:00").toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const httpOnly = u => /^https?:\/\//i.test(u || "") ? u : "";

const map = L.map("map").setView([47.3941, 0.6848], 9);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap"}).addTo(map);
const cluster = L.markerClusterGroup({showCoverageOnHover: false}).addTo(map);
let features = [];

function range(period) {
  const now = new Date(), from = new Date(now), to = new Date(now);
  if (period === "today") return [iso(from), iso(to)];
  if (period === "weekend") {
    const day = now.getDay();
    if (day === 0) return [iso(now), iso(now)];
    from.setDate(now.getDate() + (6 - day)); to.setTime(from.getTime()); to.setDate(from.getDate() + 1);
    return [iso(from), iso(to)];
  }
  if (period === "7" || period === "30") { to.setDate(now.getDate() + Number(period)); return [iso(from), iso(to)]; }
  return null;
}

function popup(p) {
  const when = p.dates.map(d => (d.start === d.end ? fmt(d.start) : `${fmt(d.start)} → ${fmt(d.end)}`) + (d.time ? ` à ${esc(d.time)}` : "")).join("<br>");
  const url = httpOnly(p.url), img = httpOnly(p.image);
  return `<div class="pop"><h2>${esc(p.title)}</h2><p>${esc(p.locality)}</p><p>${when}</p>` +
    (img ? `<img src="${esc(img)}" alt="" loading="lazy">` : "") +
    (p.description ? `<p>${esc(p.description)}${p.description.length >= 300 ? "…" : ""}</p>` : "") +
    (url ? `<p><a href="${esc(url)}" target="_blank" rel="noopener">Plus d’informations</a></p>` : "") + `</div>`;
}

function render() {
  const q = norm(document.getElementById("q").value.trim());
  const r = range(document.getElementById("period").value);
  cluster.clearLayers();
  let n = 0;
  for (const f of features) {
    const p = f.properties;
    if (q && !norm(p.title + " " + p.locality).includes(q)) continue;
    if (r && !p.dates.some(d => d.start <= r[1] && d.end >= r[0])) continue;
    const [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], {radius: 8, weight: 2, color: "#14494f", fillColor: "#1f6f78", fillOpacity: .9})
      .bindPopup(popup(p), {maxWidth: 280}).addTo(cluster);
    n++;
  }
  document.getElementById("count").textContent = n === 0 ? "Aucun événement pour ces critères." : `${n} événement${n > 1 ? "s" : ""} affiché${n > 1 ? "s" : ""}`;
}

const SB_URL = "https://tvuxgyweuecdkbhfdduq.supabase.co";
const SB_KEY = "sb_publishable_PNxoKVYUvO7TiDY4EyB_8A_OFgztynM";

async function fromSupabase() {
  const today = iso(new Date());
  const seen = encodeURIComponent(new Date(Date.now() - 3 * 864e5).toISOString());
  const rows = [];
  for (let offset = 0; ; offset += 1000) {
    const url = `${SB_URL}/rest/v1/events?select=id,title,locality,lat,lon,dates,description,image,url,last_seen` +
      `&last_end=gte.${today}&last_seen=gte.${seen}&order=first_start.asc&limit=1000&offset=${offset}`;
    const r = await fetch(url, {headers: {apikey: SB_KEY}});
    if (!r.ok) throw new Error(r.status);
    const page = await r.json();
    rows.push(...page);
    if (page.length < 1000) break;
  }
  if (!rows.length) throw new Error("vide");
  return {
    generated_at: rows.map(x => x.last_seen).sort().pop(),
    features: rows.map(({lat, lon, last_seen, ...p}) => ({type: "Feature", geometry: {coordinates: [lon, lat]}, properties: p}))
  };
}

const fromFile = () => fetch("events.geojson", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

fromSupabase().catch(fromFile).then(data => {
  features = data.features || [];
  if (data.generated_at) document.getElementById("updated").textContent = "Mis à jour le " + new Date(data.generated_at).toLocaleDateString("fr-FR") + ".";
  render();
}).catch(() => { document.getElementById("count").textContent = "Les événements n’ont pas pu être chargés. Réessayez plus tard."; });

document.getElementById("q").addEventListener("input", render);
document.getElementById("period").addEventListener("change", render);
</script>
</body>
</html>
